name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONTENT=$(sed -n "/^## v${VERSION}/,/^## v/{/^## v${VERSION}/d;/^## v/d;p}" CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Filter Manage ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Trigger server upload
        shell: bash
        env:
          UPLOAD_WEBHOOK_URL: ${{ secrets.UPLOAD_WEBHOOK_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "==> Triggering server upload for v${VERSION}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 \
            -X POST "${UPLOAD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Upload-Secret: ${UPLOAD_SECRET}" \
            -d "{\"version\":\"${VERSION}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "202" ]; then
            echo "Server accepted upload request: $BODY"
          else
            echo "::warning::Server webhook failed: HTTP ${HTTP_CODE} - ${BODY}"
          fi

      - name: 推送版本清单到更新服务
        shell: bash
        env:
          UPDATE_API_URL: ${{ secrets.UPDATE_API_URL }}
          UPDATE_RELEASE_SECRET: ${{ secrets.UPDATE_RELEASE_SECRET }}
          NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # signature: .sig 文件内容本身就是 latest.json 用的 base64 minisign 文本
          # 切勿再 jq @base64 二次编码，也切勿把 jq 的 JSON 引号写进字段值
          SIG_FILE=$(find src-tauri/target -name "*.exe.sig" | head -1)
          if [ -z "$SIG_FILE" ]; then echo "::error::.sig not found, cannot push manifest"; exit 1; fi
          SIG=$(tr -d '\r\n' < "$SIG_FILE")
          if [ -z "$SIG" ]; then echo "::error::.sig file empty"; exit 1; fi
          # assetName: setup.exe 文件名
          ASSET=$(basename "$(find src-tauri/target -name "*-setup.exe" | head -1)")
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg s "$SIG" --arg a "$ASSET" \
            '{version:$v,notes:$n,signature:$s,assetName:$a}' \
          | curl -sf -X POST "$UPDATE_API_URL" \
              -H "Content-Type: application/json" \
              -H "X-Release-Secret: $UPDATE_RELEASE_SECRET" \
              --data @-

  upload-r2:
    name: Upload release assets to Cloudflare R2
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          : "${R2_PUBLIC_URL:?R2_PUBLIC_URL secret missing}"
          mkdir -p /tmp/r2-release

          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sig" \
            --pattern "latest.json" \
            --dir /tmp/r2-release

          test -s "/tmp/r2-release/${ASSET}"
          test -s "/tmp/r2-release/${ASSET}.sig"
          test -s "/tmp/r2-release/latest.json"

          R2_ASSET_URL="${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
          jq --arg url "$R2_ASSET_URL" \
            '.platforms["windows-x86_64"].url = $url' \
            /tmp/r2-release/latest.json > /tmp/r2-release/latest-r2.json

      - name: Install R2 upload client
        run: npm install --no-save --no-package-lock --ignore-scripts @aws-sdk/client-s3

      - name: Upload assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"

          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret missing}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret missing}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID secret missing}"
          : "${R2_BUCKET:?R2_BUCKET secret missing}"

          node <<'NODE'
          const fs = require('node:fs');
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');

          const accountId = process.env.R2_ACCOUNT_ID;
          const bucket = process.env.R2_BUCKET;
          const version = process.env.VERSION;
          const asset = `Filter-Manage_${version}_x64-setup.exe`;
          const client = new S3Client({
            region: 'auto',
            endpoint: `https://${accountId}.r2.cloudflarestorage.com`,
            forcePathStyle: true,
            maxAttempts: 5,
          });

          async function put(key, file, contentType, cacheControl) {
            const body = fs.createReadStream(file);
            await client.send(new PutObjectCommand({
              Bucket: bucket,
              Key: key,
              Body: body,
              ContentType: contentType,
              CacheControl: cacheControl,
            }));
            console.log(`Uploaded ${key}`);
          }

          (async () => {
            await put(`releases/${version}/${asset}`, `/tmp/r2-release/${asset}`, 'application/vnd.microsoft.portable-executable', 'public, max-age=31536000, immutable');
            await put(`releases/${version}/${asset}.sig`, `/tmp/r2-release/${asset}.sig`, 'text/plain; charset=utf-8', 'public, max-age=31536000, immutable');
            await put('latest.json', '/tmp/r2-release/latest-r2.json', 'application/json; charset=utf-8', 'no-cache, no-store, must-revalidate');
          })().catch((error) => {
            console.error(error.name || 'R2 upload failed');
            console.error(error.message || error);
            process.exitCode = 1;
          });
          NODE

      - name: Publish R2 download links
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          {
            echo "### Cloudflare R2 upload"
            echo "- Installer: ${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
            echo "- Tauri updater manifest: ${R2_PUBLIC_URL%/}/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
