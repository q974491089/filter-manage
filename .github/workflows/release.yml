name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONTENT=$(sed -n "/^## v${VERSION}/,/^## v/{/^## v${VERSION}/d;/^## v/d;p}" CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Filter Manage ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Trigger server upload
        shell: bash
        env:
          UPLOAD_WEBHOOK_URL: ${{ secrets.UPLOAD_WEBHOOK_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "==> Triggering server upload for v${VERSION}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 \
            -X POST "${UPLOAD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Upload-Secret: ${UPLOAD_SECRET}" \
            -d "{\"version\":\"${VERSION}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "202" ]; then
            echo "Server accepted upload request: $BODY"
          else
            echo "::warning::Server webhook failed: HTTP ${HTTP_CODE} - ${BODY}"
          fi

      - name: 推送版本清单到更新服务
        shell: bash
        env:
          UPDATE_API_URL: ${{ secrets.UPDATE_API_URL }}
          UPDATE_RELEASE_SECRET: ${{ secrets.UPDATE_RELEASE_SECRET }}
          NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # signature: .sig 文件内容本身就是 latest.json 用的 base64 minisign 文本
          # 切勿再 jq @base64 二次编码，也切勿把 jq 的 JSON 引号写进字段值
          SIG_FILE=$(find src-tauri/target -name "*.exe.sig" | head -1)
          if [ -z "$SIG_FILE" ]; then echo "::error::.sig not found, cannot push manifest"; exit 1; fi
          SIG=$(tr -d '\r\n' < "$SIG_FILE")
          if [ -z "$SIG" ]; then echo "::error::.sig file empty"; exit 1; fi
          # assetName: setup.exe 文件名
          ASSET=$(basename "$(find src-tauri/target -name "*-setup.exe" | head -1)")
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg s "$SIG" --arg a "$ASSET" \
            '{version:$v,notes:$n,signature:$s,assetName:$a}' \
          | curl -sf -X POST "$UPDATE_API_URL" \
              -H "Content-Type: application/json" \
              -H "X-Release-Secret: $UPDATE_RELEASE_SECRET" \
              --data @-

  upload-r2:
    name: Upload release assets to Cloudflare R2
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          : "${R2_PUBLIC_URL:?R2_PUBLIC_URL secret missing}"
          mkdir -p /tmp/r2-release

          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sig" \
            --pattern "latest.json" \
            --dir /tmp/r2-release

          test -s "/tmp/r2-release/${ASSET}"
          test -s "/tmp/r2-release/${ASSET}.sig"
          test -s "/tmp/r2-release/latest.json"

          R2_ASSET_URL="${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
          jq --arg url "$R2_ASSET_URL" \
            '.platforms["windows-x86_64"].url = $url | .platforms["windows-x86_64-nsis"].url = $url' \
            /tmp/r2-release/latest.json > /tmp/r2-release/latest-r2.json

      - name: Upload assets to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"

          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret missing}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID secret missing}"
          : "${R2_BUCKET:?R2_BUCKET secret missing}"

          TOKEN_STATUS=$(curl -fsS --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$TOKEN_STATUS" | jq '{success, result: {status: .result.status, expires_on: .result.expires_on}}'

          npx --yes wrangler@4.105.0 r2 object put \
            "${R2_BUCKET}/releases/${VERSION}/${ASSET}" \
            --remote --force --file "/tmp/r2-release/${ASSET}" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --cache-control "public, max-age=31536000, immutable"
          npx --yes wrangler@4.105.0 r2 object put \
            "${R2_BUCKET}/releases/${VERSION}/${ASSET}.sig" \
            --remote --force --file "/tmp/r2-release/${ASSET}.sig" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
          npx --yes wrangler@4.105.0 r2 object put \
            "${R2_BUCKET}/latest.json" \
            --remote --force --file /tmp/r2-release/latest-r2.json \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Publish R2 download links
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          {
            echo "### Cloudflare R2 upload"
            echo "- Installer: ${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
            echo "- Tauri updater manifest: ${R2_PUBLIC_URL%/}/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
