name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONTENT=$(sed -n "/^## v${VERSION}/,/^## v/{/^## v${VERSION}/d;/^## v/d;p}" CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Filter Manage ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Trigger server upload
        shell: bash
        env:
          UPLOAD_WEBHOOK_URL: ${{ secrets.UPLOAD_WEBHOOK_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "==> Triggering server upload for v${VERSION}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 \
            -X POST "${UPLOAD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Upload-Secret: ${UPLOAD_SECRET}" \
            -d "{\"version\":\"${VERSION}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "202" ]; then
            echo "Server accepted upload request: $BODY"
          else
            echo "::warning::Server webhook failed: HTTP ${HTTP_CODE} - ${BODY}"
          fi

      - name: 推送版本清单到更新服务
        shell: bash
        env:
          UPDATE_API_URL: ${{ secrets.UPDATE_API_URL }}
          UPDATE_RELEASE_SECRET: ${{ secrets.UPDATE_RELEASE_SECRET }}
          NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # signature: 从构建产物 .sig 文件读（base64 文本）—— v0.3.3 漏带，这次必须补
          SIG_FILE=$(find src-tauri/target -name "*.exe.sig" | head -1)
          if [ -z "$SIG_FILE" ]; then echo "::error::.sig not found, cannot push manifest"; exit 1; fi
          SIG=$(jq -Rs @base64 < "$SIG_FILE" | tr -d '\n')
          # assetName: setup.exe 文件名
          ASSET=$(basename "$(find src-tauri/target -name "*-setup.exe" | head -1)")
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg s "$SIG" --arg a "$ASSET" \
            '{version:$v,notes:$n,signature:$s,assetName:$a}' \
          | curl -sf -X POST "$UPDATE_API_URL" \
              -H "Content-Type: application/json" \
              -H "X-Release-Secret: $UPDATE_RELEASE_SECRET" \
              --data @-
