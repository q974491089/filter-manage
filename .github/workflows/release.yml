name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONTENT=$(sed -n "/^## v${VERSION}/,/^## v/{/^## v${VERSION}/d;/^## v/d;p}" CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Filter Manage ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload to cloud drives via AList
        shell: bash
        env:
          ALIST_URL: ${{ secrets.ALIST_URL }}
          ALIST_USERNAME: ${{ secrets.ALIST_USERNAME }}
          ALIST_PASSWORD: ${{ secrets.ALIST_PASSWORD }}
        run: |
          set -euo pipefail

          STORAGES=("quark" "aliyundrive" "115" "baidu" "lanzou" "uc" "yandex" "doubao")
          REMOTE_DIR="filter-manage"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          echo "==> Logging in to AList..."
          TOKEN=$(curl -s -X POST "${ALIST_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${ALIST_USERNAME}\",\"password\":\"${ALIST_PASSWORD}\"}")

          TOKEN_VALUE=$(echo "$TOKEN" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          if [ -z "$TOKEN_VALUE" ]; then
            echo "::warning::AList login failed, skipping cloud upload"
            echo "$TOKEN"
            exit 0
          fi
          echo "AList login OK"

          INSTALLER="src-tauri/target/release/bundle/nsis/Filter-Manage_${VERSION}_x64-setup.exe"
          if [ ! -f "$INSTALLER" ]; then
            echo "::warning::NSIS installer not found at $INSTALLER, skipping cloud upload"
            exit 0
          fi
          echo "Found installer: $INSTALLER ($(du -h "$INSTALLER" | cut -f1))"

          upload_file() {
            local storage="$1"
            local local_path="$2"
            local remote_filename="$3"
            local encoded_path
            encoded_path=$(python3 -c "import urllib.parse; print(urllib.parse.quote('/${storage}/${REMOTE_DIR}/${remote_filename}'))")
            echo "Uploading to /${storage}/${REMOTE_DIR}/${remote_filename} ..."
            local response
            response=$(curl -s -w "\n%{http_code}" --max-time 300 -X PUT "${ALIST_URL}/api/fs/put" \
              -H "Authorization: ${TOKEN_VALUE}" \
              -H "File-Path: ${encoded_path}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${local_path}")
            local http_code body
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" = "200" ] && echo "$body" | grep -q '"code":200'; then
              echo "Uploaded to ${storage} OK"
              return 0
            else
              echo "::warning::Upload to ${storage} failed: HTTP ${http_code} - ${body}"
              return 1
            fi
          }

          UPLOAD_FAILED=0
          EXE_FILENAME="Filter-Manage_${VERSION}_x64-setup.exe"
          for STORAGE in "${STORAGES[@]}"; do
            if ! upload_file "$STORAGE" "$INSTALLER" "$EXE_FILENAME"; then
              UPLOAD_FAILED=1
            fi
          done

          # WuKong blocks .exe uploads (error 80003), zip it first
          ZIP_FILE="src-tauri/target/release/bundle/nsis/Filter-Manage_${VERSION}_x64-setup.zip"
          echo "Creating zip for WuKong..."
          (cd "$(dirname "$INSTALLER")" && zip -j "$(basename "$ZIP_FILE")" "$(basename "$INSTALLER")")
          ZIP_FILENAME="Filter-Manage_${VERSION}_x64-setup.zip"
          if ! upload_file "wukong" "$ZIP_FILE" "$ZIP_FILENAME"; then
            UPLOAD_FAILED=1
          fi

          if [ "$UPLOAD_FAILED" -eq 1 ]; then
            echo "::warning::Some cloud drive uploads failed, check logs above"
          else
            echo "All cloud drive uploads completed successfully"
          fi
