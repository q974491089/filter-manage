name: Upload Release to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to upload (e.g. 0.5.1, without v prefix)'
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          : "${R2_PUBLIC_URL:?R2_PUBLIC_URL secret missing}"
          mkdir -p /tmp/r2-release
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sig" \
            --pattern "latest.json" \
            --dir /tmp/r2-release
          test -s "/tmp/r2-release/${ASSET}"
          test -s "/tmp/r2-release/${ASSET}.sig"
          test -s /tmp/r2-release/latest.json

          R2_ASSET_URL="${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
          jq --arg url "$R2_ASSET_URL" \
            '.platforms["windows-x86_64"].url = $url' \
            /tmp/r2-release/latest.json > /tmp/r2-release/latest-r2.json

      - name: Install R2 upload client
        run: npm install --no-save --no-package-lock --ignore-scripts @aws-sdk/client-s3

      - name: Upload assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"

          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret missing}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret missing}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID secret missing}"
          : "${R2_BUCKET:?R2_BUCKET secret missing}"

          node <<'NODE'
          const fs = require('node:fs');
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');

          const accountId = process.env.R2_ACCOUNT_ID;
          const bucket = process.env.R2_BUCKET;
          const version = process.env.VERSION;
          const asset = `Filter-Manage_${version}_x64-setup.exe`;
          const client = new S3Client({
            region: 'auto',
            endpoint: `https://${accountId}.r2.cloudflarestorage.com`,
            forcePathStyle: true,
            maxAttempts: 5,
          });

          async function put(key, file, contentType, cacheControl) {
            const body = fs.createReadStream(file);
            await client.send(new PutObjectCommand({
              Bucket: bucket,
              Key: key,
              Body: body,
              ContentType: contentType,
              CacheControl: cacheControl,
            }));
            console.log(`Uploaded ${key}`);
          }

          (async () => {
            await put(`releases/${version}/${asset}`, `/tmp/r2-release/${asset}`, 'application/vnd.microsoft.portable-executable', 'public, max-age=31536000, immutable');
            await put(`releases/${version}/${asset}.sig`, `/tmp/r2-release/${asset}.sig`, 'text/plain; charset=utf-8', 'public, max-age=31536000, immutable');
            await put('latest.json', '/tmp/r2-release/latest-r2.json', 'application/json; charset=utf-8', 'no-cache, no-store, must-revalidate');
          })().catch((error) => {
            console.error(error.name || 'R2 upload failed');
            console.error(error.message || error);
            process.exitCode = 1;
          });
          NODE

      - name: Publish R2 download links
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          {
            echo "### Cloudflare R2 upload"
            echo "- Installer: ${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
            echo "- Tauri updater manifest: ${R2_PUBLIC_URL%/}/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
