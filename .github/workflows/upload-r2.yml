name: Upload Release to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to upload (e.g. 0.5.1, without v prefix)'
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          : "${R2_PUBLIC_URL:?R2_PUBLIC_URL secret missing}"
          mkdir -p /tmp/r2-release
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sig" \
            --pattern "latest.json" \
            --dir /tmp/r2-release
          test -s "/tmp/r2-release/${ASSET}"
          test -s "/tmp/r2-release/${ASSET}.sig"
          test -s /tmp/r2-release/latest.json

          R2_ASSET_URL="${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
          jq --arg url "$R2_ASSET_URL" \
            '.platforms["windows-x86_64"].url = $url' \
            /tmp/r2-release/latest.json > /tmp/r2-release/latest-r2.json

      - name: Upload assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PREFIX="releases/${VERSION}"

          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret missing}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret missing}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID secret missing}"
          : "${R2_BUCKET:?R2_BUCKET secret missing}"

          aws s3 cp "/tmp/r2-release/${ASSET}" "s3://${R2_BUCKET}/${PREFIX}/${ASSET}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --cache-control "public, max-age=31536000, immutable" --no-progress
          aws s3 cp "/tmp/r2-release/${ASSET}.sig" "s3://${R2_BUCKET}/${PREFIX}/${ASSET}.sig" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable" --no-progress
          aws s3 cp /tmp/r2-release/latest-r2.json "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" --no-progress

      - name: Publish R2 download links
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="Filter-Manage_${VERSION}_x64-setup.exe"
          {
            echo "### Cloudflare R2 upload"
            echo "- Installer: ${R2_PUBLIC_URL%/}/releases/${VERSION}/${ASSET}"
            echo "- Tauri updater manifest: ${R2_PUBLIC_URL%/}/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
